name: Build JDK 25 for iOS (aarch64)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "jdk25-ios" ]

jobs:
  build-ios:
    name: Build JRE 25 for iOS arm64
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Homebrew)
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Verify iOS SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
          if [ -z "$SDK" ]; then
            echo "::error::iOS SDK not found — install Xcode"
            exit 1
          fi
          echo "iOS SDK: $SDK"

      - name: Make scripts executable
        run: |
          chmod +x build_scripts/ios/*.sh
          chmod +x toolchain/bin/*

      - name: Download boot JDK 24 (macos-aarch64)
        run: |
          mkdir -p boot-jdk
          curl -L -o boot-jdk/jdk.tar.gz \
            https://download.java.net/java/GA/jdk24/1f9ff9062db4449d8ca828c504ffae90/36/GPL/openjdk-24_macos-aarch64_bin.tar.gz
          tar -xzf boot-jdk/jdk.tar.gz -C boot-jdk
          # macOS JDK ships as .jdk bundle; find bin/java anywhere inside
          BOOT_JDK_REL=$(find boot-jdk -name "java" -type f -path "*/bin/java" 2>/dev/null | head -1 | xargs -I{} dirname {} | xargs -I{} dirname {})
          BOOT_JDK_DIR="$GITHUB_WORKSPACE/$BOOT_JDK_REL"
          echo "Found boot JDK at: $BOOT_JDK_DIR"
          echo "BOOT_JDK=$BOOT_JDK_DIR" >> $GITHUB_ENV

      - name: Clone OpenJDK jdk25u source
        run: |
          git clone --depth=1 -b jdk-25-ga \
            https://github.com/openjdk/jdk25u src_jdk25u

      - name: Apply iOS patches (if any)
        run: |
          if [ -d "patches/jre_25/ios" ] && [ "$(ls -A patches/jre_25/ios/*.diff 2>/dev/null)" ]; then
            cd src_jdk25u
            for pf in ../patches/jre_25/ios/*.diff; do
              echo "Applying $pf ..."
              if git apply --check "$pf" 2>/dev/null; then
                git apply "$pf" && echo "  -> OK"
              else
                echo "  -> FAILED (rejection files in src_jdk25u/)"
                git apply --reject "$pf" || true
              fi
            done
          else
            echo "No iOS patches found — building vanilla jdk25u"
            echo "WARNING: build will likely fail without iOS-specific patches"
          fi

      - name: Build JDK 25 for iOS
        run: |
          export BUILD_JDK_VER="25"
          export BOOT_JDK="${{ env.BOOT_JDK }}"
          export BUILD_ARCH="aarch64"
          export CONFIG_TARGET="ios"
          export BUILD_OUTPUT_DIR="$PWD/build_output"
          export PATH="$PWD/toolchain/bin:$PATH"

          bash build_scripts/ios/ci_build_arch_aarch64_ios.sh

      - name: Package JRE
        run: |
          bash build_scripts/ios/tar_jdk_ios.sh

      - name: Upload JRE artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdk25-ios-aarch64-jre
          path: |-
            jdk25-ios-aarch64-jre.tar.xz
            jdk25-ios-aarch64-jre.tar.xz.sha256
          retention-days: 30
