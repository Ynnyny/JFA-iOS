name: Build JDK 25 for iOS (aarch64)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "jdk25-ios" ]

jobs:
  build-ios:
    name: Build JRE 25 for iOS arm64
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Homebrew)
        run: |
          brew install autoconf automake libtool pkg-config
          # procursus/fake-wrappers not available on GH-hosted macOS runners
          # We'll use our own wrapper scripts

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          clang --version

      - name: Show available SDKs
        run: xcrun --sdk iphoneos --show-sdk-path || true

      - name: Prepare iOS SDK paths
        id: sdk
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
          if [ -z "$SDK_PATH" ]; then
            echo "iOS SDK not found — installing via Xcode CLI…"
            echo "SDK_PATH_EXISTS=false" >> $GITHUB_OUTPUT
          else
            echo "SDK_PATH_EXISTS=true" >> $GITHUB_OUTPUT
            echo "SDK_PATH=$SDK_PATH" >> $GITHUB_OUTPUT
          fi

      - name: Set up procursus-like toolchain wrappers
        run: |
          chmod +x build_scripts/ios/*.sh
          mkdir -p toolchain/bin
          # Copy compiler wrappers
          cp build_scripts/ios/ios-arm64-clang     toolchain/bin/
          cp build_scripts/ios/ios-arm64-clang++   toolchain/bin/
          cp build_scripts/ios/macos-host-cc       toolchain/bin/
          chmod +x toolchain/bin/*

      - name: Download boot JDK 24
        run: |
          mkdir -p boot-jdk
          curl -L -o boot-jdk/jdk.tar.gz \
            https://download.java.net/java/GA/jdk24/1f9ff9062db4449d8ca828c504ffae90/36/GPL/openjdk-24_linux-x64_bin.tar.gz
          tar -xzf boot-jdk/jdk.tar.gz -C boot-jdk
          mv boot-jdk/jdk-24* boot-jdk/jdk-24
          echo "BOOT_JDK=$PWD/boot-jdk/jdk-24" >> $GITHUB_ENV

      - name: Clone OpenJDK jdk25u source
        run: |
          git clone --depth=1 -b jdk-25-ga \
            https://github.com/openjdk/jdk25u src_jdk25u

      - name: Apply iOS patches for JDK 25
        run: |
          set -e
          cd src_jdk25u
          # Apply iOS patches (adapted from JDK 21 patches)
          # If git apply fails, we log the conflicts but continue
          for pf in ../patches/jre_25/ios/*.diff; do
            echo "Applying $pf ..."
            if git apply --check "$pf" 2>/dev/null; then
              git apply "$pf"
              echo "  -> OK"
            else
              echo "  -> FAILED (will try force-apply)"
              # Try with rejection files
              git apply --reject "$pf" || true
            fi
          done

      - name: Build JDK 25 for iOS
        run: |
          export BUILD_JDK_VER="25"
          export BOOT_JDK="${{ env.BOOT_JDK }}"
          export BUILD_ARCH="aarch64"
          export CONFIG_TARGET="ios"
          export BUILD_OUTPUT_DIR="$PWD/build_output"
          export PATH="$PWD/toolchain/bin:$PATH"

          bash build_scripts/ios/ci_build_arch_aarch64_ios.sh

      - name: Package JRE
        run: |
          bash build_scripts/ios/tar_jdk_ios.sh

      - name: Upload JRE artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdk25-ios-aarch64-jre
          path: |-
            jdk25-ios-aarch64-jre.tar.xz
            jdk25-ios-aarch64-jre.tar.xz.sha256
          retention-days: 30
